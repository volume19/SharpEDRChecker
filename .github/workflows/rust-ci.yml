name: Rust CI

on:
  push:
    branches: [ "**" ]
    paths:
      - 'src/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/rust-ci.yml'
  pull_request:
    branches: [ "**" ]
    paths:
      - 'src/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/rust-ci.yml'

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test-linux:
    name: Test on Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo index
        uses: actions/cache@v4
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo build
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-cargo-build-target-${{ hashFiles('**/Cargo.lock') }}

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Build
        run: cargo build --workspace --verbose

      - name: Run tests
        run: cargo test --workspace --verbose

      - name: Build release
        run: cargo build --workspace --release --verbose

  test-windows:
    name: Test on Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Build
        run: cargo build --workspace --verbose

      - name: Run tests
        run: cargo test --workspace --verbose

      - name: Build release
        run: cargo build --workspace --release --verbose

      - name: Run binary (smoke test)
        run: |
          .\target\release\sharp_edr_checker.exe
        continue-on-error: true

      - name: Verify Windows-specific functionality
        shell: pwsh
        run: |
          Write-Host "Testing Windows-specific modules..."

          # Test that binary runs and produces output
          $output = .\target\release\sharp_edr_checker.exe 2>&1 | Out-String

          # Verify expected output sections
          if ($output -match "Welcome to SharpEDRChecker") {
            Write-Host "✓ Intro banner found"
          } else {
            Write-Error "✗ Intro banner missing"
            exit 1
          }

          if ($output -match "Checking processes") {
            Write-Host "✓ Process check section found"
          } else {
            Write-Error "✗ Process check section missing"
            exit 1
          }

          if ($output -match "Checking.*modules") {
            Write-Host "✓ Module check section found"
          } else {
            Write-Error "✗ Module check section missing"
            exit 1
          }

          if ($output -match "Checking Directories") {
            Write-Host "✓ Directory check section found"
          } else {
            Write-Error "✗ Directory check section missing"
            exit 1
          }

          if ($output -match "Checking Services") {
            Write-Host "✓ Service check section found"
          } else {
            Write-Error "✗ Service check section missing"
            exit 1
          }

          if ($output -match "Checking drivers") {
            Write-Host "✓ Driver check section found"
          } else {
            Write-Error "✗ Driver check section missing"
            exit 1
          }

          if ($output -match "TLDR Summary") {
            Write-Host "✓ Summary section found"
          } else {
            Write-Error "✗ Summary section missing"
            exit 1
          }

          if ($output -match "EDR Checks Complete") {
            Write-Host "✓ Completion banner found"
          } else {
            Write-Error "✗ Completion banner missing"
            exit 1
          }

          Write-Host "`n✅ All Windows integration checks passed!"

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: sharp_edr_checker-windows-x64
          path: target/release/sharp_edr_checker.exe
          retention-days: 7

  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit
        run: cargo install cargo-audit

      - name: Run security audit
        run: cargo audit
