[package]
name = "sharp_edr_checker"
version = "0.1.0"
edition = "2021"
authors = ["Rust port from SharpEDRChecker by @PwnDexter"]
description = "EDR/AV/logging tool detection for authorized security assessments"
license = "MIT"
repository = "https://github.com/PwnDexter/SharpEDRChecker"
rust-version = "1.70"

[[bin]]
name = "sharp_edr_checker"
path = "src/main.rs"

[dependencies]
thiserror = "1.0"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_ProcessStatus",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Threading",
    "Win32_Storage_FileSystem",
    "Win32_System_Registry",
] }
wmi = "0.13"

[dev-dependencies]
tempfile = "3.10"
criterion = "0.5"

[[bench]]
name = "edr_benchmarks"
harness = false

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"
